name: Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            simulator/frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: desktop/requirements-build.txt

      - name: Verify release tag
        working-directory: desktop
        run: |
          $packageVersion = node -p "require('./package.json').version"
          if ("v$packageVersion" -ne "${{ github.ref_name }}") {
            throw "标签 ${{ github.ref_name }} 与 desktop/package.json 版本 $packageVersion 不一致"
          }

      - name: Install Python dependencies
        run: |
          python -m venv simulator/.venv
          simulator/.venv/Scripts/python.exe -m pip install -r desktop/requirements-build.txt

      - name: Configure C++ core
        run: cmake -S simulator/core -B simulator/core/build -A x64

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Windows installer
        working-directory: desktop
        run: npm run build:win

      - name: Test updater and smoke-test packaged application
        working-directory: desktop
        run: |
          npx playwright test tests/updater.spec.cjs

          $env:CYBERARM_TEST_USER_DATA = Join-Path $env:RUNNER_TEMP 'cyberarm-release-smoke'
          $executable = (Resolve-Path 'dist/win-unpacked/CyberArm Studio.exe').Path
          $application = Start-Process -FilePath $executable -PassThru -WindowStyle Hidden
          try {
            $deadline = (Get-Date).AddSeconds(90)
            $backend = $null
            do {
              Start-Sleep -Seconds 2
              $application.Refresh()
              if ($application.HasExited) {
                throw "打包版应用在启动检查期间退出，退出码：$($application.ExitCode)"
              }
              $backend = Get-CimInstance Win32_Process -Filter "ParentProcessId = $($application.Id)" |
                Where-Object Name -eq 'cyberarm-backend.exe'
            } while (-not $backend -and (Get-Date) -lt $deadline)

            if (-not $backend) {
              throw '打包版应用启动后未能运行内置后端。'
            }
            Start-Sleep -Seconds 10
            $application.Refresh()
            if ($application.HasExited) {
              throw "打包版应用未能稳定运行，退出码：$($application.ExitCode)"
            }
          }
          finally {
            taskkill.exe /PID $application.Id /T /F | Out-Null
          }

      - name: Publish GitHub Release assets
        working-directory: desktop
        run: npm run publish:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Archive installer metadata
        uses: actions/upload-artifact@v4
        with:
          name: CyberArm-Studio-Windows-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            desktop/dist/CyberArm-Studio-Setup-*.exe
            desktop/dist/CyberArm-Studio-Setup-*.exe.blockmap
            desktop/dist/latest.yml
