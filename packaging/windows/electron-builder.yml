appId: com.cyberarm.studio
productName: CyberArm Studio
artifactName: CyberArm-Setup-${version}-${arch}.${ext}
directories:
  app: .
  output: dist
  buildResources: resources
files:
  - electron/**
  - package.json
extraResources:
  - from: ../../simulator/frontend/dist
    to: frontend
  - from: ../../simulator/assets/revc
    to: assets/revc
  - from: ../../simulator/core/build/libcyberarm_core.dll
    to: core/libcyberarm_core.dll
  - from: backend/dist/cyberarm-backend.exe
    to: backend/cyberarm-backend.exe
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  executableName: CyberArm
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CyberArm Studio
  runAfterFinish: true
publish:
  provider: github
  owner: 77-GGG
  repo: CyberArm
  releaseType: release
